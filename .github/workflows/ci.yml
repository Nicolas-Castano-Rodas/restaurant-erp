name: Dependency upgrade candidate

on:
  push:
    branches: [release/dependency-review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restaurant_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: restaurant_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant_test -d restaurant_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://restaurant_test:ci_only_password@localhost:5432/restaurant_erp_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve candidate dependency versions
        run: |
          npm pkg set "dependencies.@prisma/client=7.10.1" "dependencies.@prisma/adapter-pg=7.10.1" "devDependencies.prisma=7.10.1" "overrides.exceljs.uuid=11.1.1" "overrides.@prisma/config.effect=^3.22.1"
          npm install --package-lock-only --ignore-scripts
      - name: Verify candidate dependency graph
        run: |
          node -e 'const lock = require("./package-lock.json"); for (const [path, pkg] of Object.entries(lock.packages)) { if (/(^|\/)node_modules\/(effect|uuid|deepmerge-ts|mysql2|prisma)$/.test(path)) console.log(path, pkg.version); }'
      - name: Preserve candidate manifests
        uses: actions/upload-artifact@v4
        with:
          name: dependency-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Install candidate from generated lock
        run: npm ci
      - name: Generate client without database credentials
        run: env -u DATABASE_URL npm run db:generate
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Tenant integrity integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run db:test
      - name: Authentication and workspace integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run auth:test
      - name: Catalog and table integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run catalog:test
      - name: POS order integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run orders:test
      - name: Kitchen transition integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run kitchen:test
      - name: Cash payment integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run cash:test
      - name: Inventory movement integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run inventory:test
      - name: Recipe consumption integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run recipes:test
      - name: Purchase receipt integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run purchases:test
      - name: Analytics integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run analytics:test
      - name: Team administration integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run team:test
      - run: npm run ui:contrast
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: HTTP smoke test
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/restaurant-erp.log 2>&1 &
          trap 'cat /tmp/restaurant-erp.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health | grep '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/ready | grep '"status":"ready"'
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/login | grep -q 'Iniciar sesión'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/catalog)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/catalog)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/tables)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/pos)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/orders)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/kitchen)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/cash)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/inventory)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/recipes)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/purchases)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/customers)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/deliveries)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/analytics)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/reports)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/reports)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/team)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/account)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/audit)" = "307"
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser workflow and accessibility smoke tests
        env:
          RUN_BROWSER_TESTS: "true"
        run: npm run test:e2e

      - name: Restore synthetic database backup and compare records
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash scripts/ci-restore-check.sh
      - name: Build production container without database credentials
        run: docker build -t restaurant-erp-ci .
      - name: Verify production container and database readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect restaurant-erp-ci --format '{{.Config.User}}')" = "node"
          docker run -d --name restaurant-erp-ci --network host --env DATABASE_URL restaurant-erp-ci node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3200
          trap 'docker logs restaurant-erp-ci; docker rm -f restaurant-erp-ci' EXIT
          curl -fsS --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3200/api/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:3200/api/ready | grep '"status":"ready"'
          curl -fsS http://127.0.0.1:3200/login | grep -q 'Iniciar sesión'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/dashboard)" = "307"
      - name: Audit candidate build and runtime dependencies
        run: npm audit --audit-level=high
