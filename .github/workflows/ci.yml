name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restaurant_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: restaurant_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant_test -d restaurant_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://restaurant_test:ci_only_password@localhost:5432/restaurant_erp_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate client without database credentials
        run: env -u DATABASE_URL npm run db:generate
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Tenant integrity integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run db:test
      - name: Authentication and workspace integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run auth:test
      - name: Catalog and table integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run catalog:test
      - name: POS order integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run orders:test
      - name: Kitchen transition integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run kitchen:test
      - name: Cash payment integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run cash:test
      - name: Inventory movement integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run inventory:test
      - name: Recipe consumption integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run recipes:test
      - name: Purchase receipt integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run purchases:test
      - name: Analytics integration test
        env:
          RUN_DB_TESTS: "true"
        run: npm run analytics:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: HTTP smoke test
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/restaurant-erp.log 2>&1 &
          trap 'cat /tmp/restaurant-erp.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health | grep '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/login | grep -q 'Iniciar sesión'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/catalog)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/catalog)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/tables)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/pos)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/orders)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/kitchen)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/cash)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/inventory)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/recipes)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/purchases)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/customers)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/deliveries)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/analytics)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/reports)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/reports)" = "401"
